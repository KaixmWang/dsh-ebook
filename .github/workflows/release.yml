# 打 tag（v0.5.2）时自动打包成 tarball 并挂到 GitHub Release，
# 这样 DSH 可以直接用 release 里的 tgz 安装：
#   pnpm add https://github.com/<owner>/dsh-ebook/releases/download/v0.5.2/dsh-ebook-0.5.2.tgz
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 只装打包需要的依赖（canvas 的原生包在 Linux CI 上也会装上，但不会进 tarball）
      - run: npm ci

      - name: 校验插件入口与补丁文件语法
        run: |
          node --check index.js
          node --check client.js
          for f in $(git ls-files 'src/**/*.js'); do node --check "$f"; done
          node -e "require('js-yaml')" 2>/dev/null || npm i --no-save js-yaml
          node -e "const yaml=require('js-yaml'),fs=require('fs');const doc=yaml.load(fs.readFileSync('cordis.patch.yml','utf8'));if(!Array.isArray(doc))throw new Error('patch 顶层必须是数组');console.log('patch ok')"

      - name: 打包
        run: npm pack

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-ebook-*.tgz
          generate_release_notes: true
